
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Uplyst</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <header class="navbar">
        <a href="index.html" class="logo">
            <span class="logo-icon">U</span>
            <span>uplyst<span class="logo-dot">.</span></span>
        </a>

        <div class="nav-actions">
            <button class="theme-toggle" id="themeToggle" aria-label="Switch theme">
                ☀️
            </button>
            <a href="register.html" class="signup-btn">Create Account ↗</a>
        </div>
    </header>

    <main class="auth-container">

        <section class="auth-card">

            <div class="auth-icon">✦</div>

            <span class="eyebrow">WELCOME BACK</span>

            <h1>Good to see <span class="gradient-text">you again.</span></h1>

            <p class="auth-description">
                Your next big opportunity is just a step away.
                Sign in to continue your journey.
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div class="form-options">
                    <label class="remember-option">
                        <input type="checkbox" id="remember">
                        Remember me
                    </label>

                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="auth-submit">
                    Log In ↗
                </button>

            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="register.html">Sign up</a>
            </p>

            <div class="auth-footer">
                Level up. Stand out. 💜
            </div>

        </section>

    </main>

    <script src="js/app.js"></script>

</body>
</html>

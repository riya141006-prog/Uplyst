
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Uplyst</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <!-- NAVBAR -->
    <header class="navbar">

        <a href="index.html" class="logo">
            <span class="logo-icon">U</span>
            <span>uplyst<span class="logo-dot">.</span></span>
        </a>

        <div class="nav-actions">
            <button class="theme-toggle" id="themeToggle" aria-label="Switch theme">
                ☀️
            </button>

            <a href="login.html" class="login-btn">Log in</a>
        </div>

    </header>


    <!-- REGISTRATION -->
    <main class="auth-container">

        <section class="auth-card register-card">

            <div class="auth-icon">🚀</div>

            <span class="eyebrow">YOUR JOURNEY STARTS HERE</span>

            <h1>Create your <span class="gradient-text">account.</span></h1>

            <p class="auth-description">
                Join Uplyst and take your first step towards
                building the future you imagine.
            </p>


            <form id="registerForm">

                <div class="form-group">
                    <label for="fullName">Full name</label>
                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="role">I am a</label>

                    <select id="role" required>
                        <option value="" disabled selected>Select your role</option>
                        <option value="student">Student</option>
                        <option value="graduate">Graduate</option>
                        <option value="professional">Working Professional</option>
                    </select>
                </div>


                <div class="form-group">
                    <label for="password">Create password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="8"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your password"
                        minlength="8"
                        required
                    >
                </div>


                <label class="terms-option">
                    <input type="checkbox" id="terms" required>
                    <span>
                        I agree to the Terms of Service and Privacy Policy.
                    </span>
                </label>


                <button type="submit" class="auth-submit">
                    Create Account ↗
                </button>

            </form>


            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Log in</a>
            </p>


            <div class="auth-footer">
                Level up. Stand out. 💜
            </div>

        </section>

    </main>


    <script src="js/app.js"></script>

</body>
</html>
